name: rc17 converge

on:
  push:
    branches:
      - agent/rc17-two-stage-finalize

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply final rc17 architecture
        run: |
          python .github/rc17_converge.py
          python -m py_compile main.py
          git diff --check

      - name: Commit clean rc17 business diff
        run: |
          rm .github/rc17_converge.py .github/workflows/rc17_converge.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: converge rc17 on one native orchestration skill'
          git push origin HEAD:${{ github.ref_name }}
