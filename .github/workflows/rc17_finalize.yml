name: rc17 finalize

on:
  push:
    branches:
      - agent/rc17-two-stage-finalize

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply and validate rc17 patch
        run: |
          python .github/rc17_finalize.py
          python -m py_compile main.py
          git diff --check

      - name: Commit finalized rc17 patch
        run: |
          rm .github/rc17_finalize.py .github/workflows/rc17_finalize.yml
          git add main.py README.md skills .github/rc17_finalize.py .github/workflows/rc17_finalize.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: optimize rc17 two-stage tool routing'
          git push origin HEAD:${{ github.ref_name }}
