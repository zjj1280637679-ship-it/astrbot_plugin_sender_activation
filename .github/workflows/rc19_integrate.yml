name: rc19 attention integration patch

on:
  push:
    branches:
      - agent/rc19-attention-runtime

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply integration patch
        run: |
          python .github/rc19_integrate.py
          python -m py_compile main.py settings.py attention_domain.py attention_service.py echo_service.py
          python -m json.tool _conf_schema.json >/dev/null
          grep -q 'VERSION = "1.1.0-rc.19"' main.py
          grep -q 'version: "1.1.0-rc.19"' metadata.yaml
          grep -q 'astrbot_version: ">=4.26.1"' metadata.yaml
          git diff --check
      - name: Commit clean source diff
        run: |
          rm .github/rc19_integrate.py .github/workflows/rc19_integrate.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add main.py metadata.yaml .github/rc19_integrate.py .github/workflows/rc19_integrate.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: wire finite ignore and echo into agent attention runtime'
          git push origin HEAD:${{ github.ref_name }}
