name: rc19 heartbeat lifecycle truth fix

on:
  push:
    branches:
      - agent/rc19-attention-runtime

permissions:
  contents: write

jobs:
  heartbeat-truth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply truth fix and run counterexamples
        run: |
          python .github/rc19_heartbeat_truth_fix.py
          python -m py_compile main.py cron_adapter.py heartbeat_service.py .github/rc19_heartbeat_truth_tests.py
          cd ..
          python astrbot_plugin_sender_activation/.github/rc19_heartbeat_truth_tests.py
          cd astrbot_plugin_sender_activation
          git diff --check
      - name: Commit clean candidate diff
        run: |
          rm .github/rc19_heartbeat_truth_fix.py .github/workflows/rc19_heartbeat_truth_fix.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add main.py cron_adapter.py heartbeat_service.py .github/rc19_heartbeat_truth_tests.py .github/rc19_heartbeat_truth_fix.py .github/workflows/rc19_heartbeat_truth_fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve heartbeat lifecycle truth under preflight failures'
          git push origin HEAD:${{ github.ref_name }}
