name: rc19 README consistency patch

on:
  push:
    branches:
      - agent/rc19-attention-runtime

permissions:
  contents: write

jobs:
  docs-consistency:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply README consistency patch
        run: |
          python .github/rc19_readme_consistency.py
          grep -q '七个 Tool' README.md
          grep -q 'manage_attention_ignore' README.md
          grep -q 'manage_echo_hook' README.md
          git diff --check
      - name: Commit clean README diff
        run: |
          rm .github/rc19_readme_consistency.py .github/workflows/rc19_readme_consistency.yml
          git add README.md .github/rc19_readme_consistency.py .github/workflows/rc19_readme_consistency.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: keep rc19 tool count and compatibility wording truthful'
          git push origin HEAD:${{ github.ref_name }}
