name: rc17 cleanup

on:
  push:
    branches:
      - agent/rc17-two-stage-finalize

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Remove non-source artifacts
        run: |
          rm -rf __pycache__
          rm .github/workflows/rc17_cleanup.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove compiled cache from rc17'
          git push origin HEAD:${{ github.ref_name }}
