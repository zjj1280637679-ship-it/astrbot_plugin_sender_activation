name: rc19 owned cron context fix

on:
  push:
    branches:
      - agent/rc19-attention-runtime

permissions:
  contents: write

jobs:
  fix-owned-cron:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply fix and validate
        run: |
          python .github/rc19_cron_fix.py
          python -m py_compile main.py
          git diff --check
      - name: Commit clean fix
        run: |
          rm .github/rc19_cron_fix.py .github/workflows/rc19_cron_fix.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add main.py .github/rc19_cron_fix.py .github/workflows/rc19_cron_fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recover scope and actor only for owned proactive cron turns'
          git push origin HEAD:${{ github.ref_name }}
