name: rc19 Echo deletion contract fix

on:
  push:
    branches:
      - agent/rc19-attention-runtime

permissions:
  contents: write

jobs:
  fix-echo-delete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply deletion fix and counterexample
        run: |
          python .github/rc19_echo_delete_fix.py
          python .github/rc19_echo_delete_fixture.py
          python -m py_compile echo_service.py main.py .github/rc19_core_tests.py
          cd ..
          python astrbot_plugin_sender_activation/.github/rc19_core_tests.py
          cd astrbot_plugin_sender_activation
          git diff --check
      - name: Commit clean candidate diff
        run: |
          rm .github/rc19_echo_delete_fix.py .github/rc19_echo_delete_fixture.py .github/workflows/rc19_echo_delete_fix.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add echo_service.py main.py .github/rc19_core_tests.py .github/rc19_echo_delete_fix.py .github/rc19_echo_delete_fixture.py .github/workflows/rc19_echo_delete_fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: never report failed Echo deletion as success'
          git push origin HEAD:${{ github.ref_name }}
