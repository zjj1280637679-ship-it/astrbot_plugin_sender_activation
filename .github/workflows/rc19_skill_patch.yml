name: rc19 attention Skill patch

on:
  push:
    branches:
      - agent/rc19-attention-runtime

permissions:
  contents: write

jobs:
  patch-skill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch and validate Skill
        run: |
          python .github/rc19_skill_patch.py
          grep -q 'manage_attention_ignore' skills/group-duty-orchestration/SKILL.md
          grep -q 'manage_echo_hook' skills/group-duty-orchestration/SKILL.md
          grep -q '回响回合绝不能再创建回响' skills/group-duty-orchestration/SKILL.md
          git diff --check
      - name: Commit clean Skill diff
        run: |
          rm .github/rc19_skill_patch.py .github/workflows/rc19_skill_patch.yml
          git add skills/group-duty-orchestration/SKILL.md .github/rc19_skill_patch.py .github/workflows/rc19_skill_patch.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: teach agent finite ignore and optional echo semantics'
          git push origin HEAD:${{ github.ref_name }}
