name: rc19 heartbeat stale-driver reconcile

on:
  push:
    branches:
      - agent/rc19-attention-runtime

permissions:
  contents: write

jobs:
  stale-driver-reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply fail-closed reconcile and run counterexamples
        run: |
          python .github/rc19_heartbeat_reconcile_patch.py
          python -m py_compile heartbeat_gate.py main.py .github/rc19_heartbeat_gate_tests.py
          cd ..
          python astrbot_plugin_sender_activation/.github/rc19_heartbeat_gate_tests.py
          cd astrbot_plugin_sender_activation
          git diff --check
      - name: Commit clean candidate diff
        run: |
          rm .github/rc19_heartbeat_reconcile_patch.py .github/workflows/rc19_heartbeat_reconcile_patch.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add heartbeat_gate.py main.py .github/rc19_heartbeat_gate_tests.py .github/rc19_heartbeat_reconcile_patch.py .github/workflows/rc19_heartbeat_reconcile_patch.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: fail closed when stale heartbeat drivers survive reload'
          git push origin HEAD:${{ github.ref_name }}
