name: rc19 attention core counterexamples

on:
  push:
    branches:
      - agent/rc19-attention-runtime

permissions:
  contents: read

jobs:
  core-counterexamples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and counterexample tests
        run: |
          python --version
          python -m py_compile attention_domain.py attention_service.py echo_service.py
          cd ..
          python astrbot_plugin_sender_activation/.github/rc19_core_tests.py
          cd astrbot_plugin_sender_activation
          git diff --check
