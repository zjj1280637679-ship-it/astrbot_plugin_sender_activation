name: rc17 AstrBot compatibility

on:
  push:
    branches:
      - agent/rc17-two-stage-finalize

permissions:
  contents: write

jobs:
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Runtime info
        run: |
          python --version
          python -m pip --version

      - name: Fetch current AstrBot
        run: |
          git clone --depth 1 https://github.com/AstrBotDevs/AstrBot.git /tmp/AstrBot
          python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('/tmp/AstrBot/pyproject.toml').read_text(encoding='utf-8'))
          print('AstrBot version:', data['project']['version'])
          assert data['project']['version'] >= '4.27.2'
          PY

      - name: Install AstrBot and test plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e /tmp/AstrBot
          python .github/rc17_compat_test.py
          python -m py_compile main.py

      - name: Remove one-shot compatibility test
        run: |
          rm .github/rc17_compat_test.py .github/workflows/rc17_compat.yml
          git add .github/rc17_compat_test.py .github/workflows/rc17_compat.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: pass AstrBot rc17 compatibility check'
          git push origin HEAD:${{ github.ref_name }}
