name: rc19 Echo preflight patch

on:
  push:
    branches:
      - agent/rc19-attention-runtime

permissions:
  contents: write

jobs:
  patch-echo-preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply Echo preflight patch and fixture patch
        run: |
          python .github/rc19_echo_preflight.py
          python .github/rc19_echo_fixture_patch.py
          python -m py_compile main.py echo_service.py .github/rc19_core_tests.py
          git diff --check
      - name: Run counterexamples before committing
        run: |
          cd ..
          python astrbot_plugin_sender_activation/.github/rc19_core_tests.py
          cd astrbot_plugin_sender_activation
      - name: Commit clean candidate diff
        run: |
          rm .github/rc19_echo_preflight.py .github/rc19_echo_fixture_patch.py .github/workflows/rc19_echo_preflight.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git add main.py echo_service.py .github/rc19_core_tests.py .github/rc19_echo_preflight.py .github/rc19_echo_fixture_patch.py .github/workflows/rc19_echo_preflight.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preflight Echo before consuming an Agent turn'
          git push origin HEAD:${{ github.ref_name }}
