name: integration check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - main.py
      - settings.py
      - host_diagnostics.py
      - attention_domain.py
      - attention_service.py
      - echo_service.py
      - heartbeat_domain.py
      - heartbeat_gate.py
      - heartbeat_service.py
      - cron_adapter.py
      - tests/test_heartbeat_truth.py
      - tests/test_astrbot_runtime.py
      - .github/workflows/integration-check.yml
  push:
    branches: [main]
    paths:
      - main.py
      - settings.py
      - host_diagnostics.py
      - attention_domain.py
      - attention_service.py
      - echo_service.py
      - heartbeat_domain.py
      - heartbeat_gate.py
      - heartbeat_service.py
      - cron_adapter.py
      - tests/test_heartbeat_truth.py
      - tests/test_astrbot_runtime.py
      - .github/workflows/integration-check.yml

permissions:
  contents: read

jobs:
  astrbot-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - astrbot_tag: v4.27.2
            astrbot_sha: ad4fbfa90ca0c4ac2b30b3250e34dbf8fe7babbf
            astrbot_version: 4.27.2
          - astrbot_tag: v4.28.2
            astrbot_sha: 3c7adafa1397e182d60b1016bf88759265113c8a
            astrbot_version: 4.28.2
    env:
      ASTRBOT_BASELINE_TAG: ${{ matrix.astrbot_tag }}
      ASTRBOT_BASELINE_SHA: ${{ matrix.astrbot_sha }}
      ASTRBOT_BASELINE_VERSION: ${{ matrix.astrbot_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned AstrBot runtime
        run: |
          git clone --depth 1 --branch "$ASTRBOT_BASELINE_TAG" https://github.com/AstrBotDevs/AstrBot.git /tmp/AstrBot
          test "$(git -C /tmp/AstrBot rev-parse HEAD)" = "$ASTRBOT_BASELINE_SHA"
          python - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('/tmp/AstrBot/pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          print('AstrBot source version:', version)
          import os
          assert version == os.environ['ASTRBOT_BASELINE_VERSION'], version
          PY
          python -m pip install --user -e /tmp/AstrBot

      - name: Run host integration invariants
        run: |
          python tests/test_heartbeat_truth.py
          python tests/test_astrbot_runtime.py

      - name: Candidate consistency
        run: |
          python -m py_compile main.py settings.py host_diagnostics.py attention_domain.py attention_service.py echo_service.py
          python -m json.tool _conf_schema.json >/dev/null
          git diff --check
