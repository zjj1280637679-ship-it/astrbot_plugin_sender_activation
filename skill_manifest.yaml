schema_version: 1

skill:
  id: sender_activation

  display_name: "管理员的真理捍卫器"

  summary: >
    管理 AI 在群聊中的主动关注能力。
    当用户希望 AI 未来持续关注某个成员发言、
    无需@即可响应，或者需要周期性自主检查时使用。

  category:
    - agent_control
    - proactive_attention
    - group_chat

  intent:
    positive:
      - 用户希望未来持续关注某人的消息
      - 用户希望不用@也能收到响应
      - 用户希望AI主动参与后续群聊
      - 用户希望定时检查群聊状态

    negative:
      - 用户只是询问插件功能
      - 用户讨论实现原理
      - 用户提出假设场景
      - 用户引用别人提出的需求
      - 用户只需要当前一次回复

  capabilities:
    activation:
      description: 建立有限期主动关注能力
      tools:
        - manage_sender_activation

    rate_control:
      description: 控制主动关注频率
      tools:
        - manage_sender_activation_rate

    heartbeat:
      description: 创建周期性 Agent 检查机会
      tools:
        - manage_heartbeat_lease

    yield:
      description: 主动结束无价值的额外唤醒回合
      tools:
        - yield_current_turn
